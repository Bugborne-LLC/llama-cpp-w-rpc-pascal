name: Build All Docker Images (Matrix)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Llama.cpp builds
          - image_name: llama-server
            context: ./llama-cpp-with-rpc
            tag: latest
          - image_name: llama-rpc-pascal
            context: ./llama-rpc-1080-ti
            tag: latest
          - image_name: llama-server-pascal
            context: ./llama-server-1080-ti
            tag: latest

          # Completely unrelated Android/Forgejo CLI build
          - image_name: opencode-android-cli-forgejo
            context: ./opencode-android-cli-forgejo
            tag: latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/${{ matrix.image_name }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
