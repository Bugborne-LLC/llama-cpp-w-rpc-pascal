name: Bleeding Edge Build (llama-server & rpc-worker)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build Containers with Latest llama.cpp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update llama.cpp & capture commit SHA
        id: submodule
        run: |
          cd llama.cpp
          git fetch origin
          git checkout origin/master
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          cd ..

      - name: Set lowercase repository owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Primary Host (llama-server)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/llama-server:latest
          labels: |
            org.opencontainers.image.revision=${{ steps.submodule.outputs.COMMIT_SHA }}
            org.opencontainers.image.source=https://github.com/ggml-org/llama.cpp
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push RPC Worker (1080 Ti - Pascal)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.rpc-pascal
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/llama-rpc-pascal:latest
          labels: |
            org.opencontainers.image.revision=${{ steps.submodule.outputs.COMMIT_SHA }}
            org.opencontainers.image.source=https://github.com/ggml-org/llama.cpp
          cache-from: type=gha
          cache-to: type=gha,mode=max
